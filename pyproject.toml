# Tooling configuration only. The application is not packaged; the release
# artifact ships main.py, the lightsail_demo/ package and requirements.txt.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["public", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "PL", "RUF"]
ignore = [
  "S101",    # assert is fine in tests
  "S311",    # random is used for worm positions, not security
  "PLR0913", # argument counts in small helpers
  "PLR2004", # magic values in tests and bounds
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415", "PLW1510", "B011", "ASYNC", "E501", "SLF001"]
"scripts/**" = ["S603", "S607", "PLR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "browser: real Chromium (Playwright) tests; skipped unless RUN_BROWSER_TESTS=1 or a browser is available",
  "caddy: isolated loopback Caddy integration tests; skipped unless the caddy binary is available",
  "slow: tests that take more than a couple of seconds",
  "deploy: sandboxed runs of the remote activation script (real venvs; needs the locked wheels)",
]
filterwarnings = ["error::DeprecationWarning:lightsail_demo"]
